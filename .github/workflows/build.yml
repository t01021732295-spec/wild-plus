name: Build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build with Gradle
        id: build
        run: |
          set -o pipefail
          ./gradlew build --no-daemon 2>&1 | tee build.log

      - name: Server smoke test
        id: smoke
        if: steps.build.outcome == 'success'
        timeout-minutes: 10
        run: |
          set -o pipefail
          mkdir -p run
          echo "eula=true" > run/eula.txt
          printf 'online-mode=false\nlevel-type=minecraft\\:normal\n' > run/server.properties
          # 서버를 켜서 모드가 정상 로드되는지 확인 후 종료
          ( sleep 240; echo "stop" ) | timeout 540 ./gradlew runServer --no-daemon 2>&1 | tee server.log || true
          grep -q 'Done (' server.log

      - name: Publish logs for debugging
        if: always()
        run: |
          mkdir -p /tmp/pub
          [ -f build.log ] && grep -E -B2 -A6 "error:|warning: \[|FAILURE|What went wrong|Exception|BUILD" build.log | head -c 200000 > /tmp/pub/build-errors.txt || true
          [ -f build.log ] && tail -c 60000 build.log > /tmp/pub/build-tail.txt || true
          [ -f server.log ] && grep -i -E "wildplus|error|exception|caused by|Done \(|failed" server.log | head -c 200000 > /tmp/pub/server-filtered.txt || true
          [ -f server.log ] && tail -c 80000 server.log > /tmp/pub/server-tail.txt || true
          echo "build=${{ steps.build.outcome }} smoke=${{ steps.smoke.outcome }} sha=${{ github.sha }}" > /tmp/pub/status.txt
          cd /tmp/pub
          git init -q -b ci-log
          git config user.name "ci"; git config user.email "ci@users.noreply.github.com"
          git add . && git commit -qm "logs ${{ github.sha }}"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" ci-log

      - name: Publish release jar
        if: steps.build.outcome == 'success' && steps.smoke.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          JAR=$(ls build/libs/*.jar | grep -v -E 'sources|javadoc' | head -1)
          gh release delete latest -y --cleanup-tag || true
          gh release create latest "$JAR" --title "Wild Plus (최신 빌드)" \
            --notes "Minecraft 26.3 · NeoForge 용. 이 jar 파일을 CurseForge 프로필의 mods 폴더에 넣으세요."
