      - name: Client focus test (3.9 화면만)
        id: focus
        if: steps.smoke.outcome == 'success' && contains(github.event.head_commit.message, '[focus]')
        continue-on-error: true
        timeout-minutes: 25
        env:
          WILDPLUS_UITEST: '1'
          LIBGL_ALWAYS_SOFTWARE: '1'
          MC_QUICKPLAY: wildtest
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q xvfb libgl1-mesa-dri mesa-vulkan-drivers libvulkan1 imagemagick x11-utils xdotool
          mkdir -p run/saves && cp -r run/world run/saves/wildtest
          pip install -q nbtlib
          python3 - <<'PY'
          import nbtlib
          f = nbtlib.load('run/saves/wildtest/level.dat')
          d = f['Data'] if 'Data' in f else f
          d['allowCommands'] = nbtlib.Byte(1)
          f.save()
          PY
          printf 'onboardAccessibility:false\npauseOnLostFocus:false\nlang:ko_kr\nguiScale:2\n' > run/options.txt
          xvfb-run -a -s "-screen 0 1280x720x24+32 +extension GLX +render -noreset" bash -c '
            ./gradlew runClient --no-daemon > client.log 2>&1 &
            for i in $(seq 1 90); do sleep 5; grep -q -E "logged in with entity id|Loaded [0-9]+ advancements|joined the game" client.log && break; done
            sleep 40
            cmd() { xdotool key t; sleep 1; xdotool type --delay 40 "$1"; sleep 0.5; xdotool key Return; sleep 1.5; }
            shot() { sleep 2; import -window root "shot-$1.png" || true; }
            esc() { xdotool key Escape; sleep 1; }
            cmd "/effect give @s minecraft:resistance 900 255 true"
            cmd "/gamemode creative"
            cmd "/time set noon"
            cmd "/weather clear"
            # 약국 · 기상
            cmd "/tp @s 396.5 120 -8.3 0 20"
            # 4.4 엔드: 평원 지형 · 몬스터 · 공허 군주
            cmd "/gamemode creative"; cmd "/effect give @s minecraft:night_vision 200 0 true"
            cmd "/gamemode creative"; sleep 1
            cmd "/wildplus uitest market"; sleep 2; shot v48-market; esc
            cmd "/wildplus uitest bulkship"; sleep 2; shot v48-bulk; esc
            cmd "/wildplus uitest musichelp"; sleep 2; shot v48-help; esc
            xdotool key --clearmodifiers m; sleep 3; shot v48-bigmap
            cmd "/wildplus uitest endplains"; sleep 1
            cmd "/wildplus uitest endplains"; sleep 25
            cmd "/execute at @s run summon wildplus:volcano_boss ^ ^-9 ^14"; sleep 3; shot m47-volcano; cmd "/kill @e[type=wildplus:volcano_boss]"
            cmd "/execute at @s run summon wildplus:storm_king ^ ^-7 ^11"; sleep 3; shot m47-storm; cmd "/kill @e[type=wildplus:storm_king]"
            cmd "/execute at @s run summon wildplus:cloud_sentinel ^-3 ^-4 ^7"; cmd "/execute at @s run summon wildplus:cloud_priest ^1 ^-4 ^8"; cmd "/execute at @s run summon wildplus:thunder_hawk ^4 ^-2 ^8"; sleep 3; shot m47-mobs
            cmd "/kill @e[type=wildplus:cloud_sentinel]"; cmd "/kill @e[type=wildplus:cloud_priest]"; cmd "/kill @e[type=wildplus:thunder_hawk]"
            cmd "/wildplus uitest endplains"; sleep 30
            shot end-plains
            cmd "/execute at @s run summon wildplus:void_lord ^ ^-5 ^8"; sleep 6; shot end-lord-1; sleep 1; shot end-lord-2; sleep 1; shot end-lord-3
            cmd "/kill @e[type=wildplus:void_lord]"; sleep 2
            cmd "/execute at @s run summon wildplus:void_stalker ~-3 ~-4 ~8"; cmd "/execute at @s run summon wildplus:void_wraith ~3 ~-2 ~8"; cmd "/execute at @s run summon wildplus:rift_mite ~ ~-4 ~6"; sleep 3; shot end-mobs
            xdotool key F1 || true
            cmd "/wildplus uitest brew"; sleep 2; shot v40-brew; esc
            cmd "/wildplus uitest pharmacy"; shot v39-pharmacy
            xdotool mousemove 520 258; sleep 0.5; xdotool click 1; sleep 1; shot v39-pharmacy-pick
            esc
            cmd "/wildplus uitest weather"; shot v39-weather; esc
            # 땅: 사기 → 경계 기둥 · 지도
            cmd "/tp @s 648.5 121 8.5 0 10"
            sleep 6
            cmd "/fill 636 119 -4 676 119 36 minecraft:grass_block"
            cmd "/fill 636 120 -4 676 127 36 minecraft:air"
            sleep 2
            cmd "/wildplus uitest landbuy"; shot v39-land-title
            cmd "/tp @s 643.5 124 13.5 -135 25"; sleep 3
            xdotool key F1 || true; shot v39-land-posts; xdotool key F1 || true
            cmd "/tp @s 633.5 122 4.5 -60 12"; sleep 4
            xdotool key F1 || true; shot v39-land-fence; xdotool key F1 || true
            cmd "/tp @s 648.5 121 8.5 0 10"
            cmd "/wildplus uitest land"; shot v39-land; esc
            # 순간이동 지점 (서버 테스트에서 놓은 두 지점)
            cmd "/tp @s 380.5 120 -8.3 0 20"
            sleep 3; xdotool click 3; shot v39-warp; esc
            # 대회 게시판 · 계약서 · 제단
            cmd "/wildplus uitest contest"; shot v39-contest; esc
            cmd "/wildplus uitest contract"; shot v39-contract; esc
            cmd "/wildplus uitest altar"; shot v39-altar; esc
            # 순간이동기 (다른 유저가 없을 때)
            cmd "/clear @s"
            cmd "/give @s wildplus:teleporter"
            cmd "/tp @s 380.5 125 -8.3 0 -60"
            xdotool key 1; sleep 0.5; xdotool click 3; shot v39-teleporter; esc
            cmd "/clear @s"
            # 우민 감옥: 놓기 → 포로 셋 → 바깥 모습 · 감옥 화면 · 포로 화면
            cmd "/tp @s 600.5 121 0.5 180 0"
            sleep 6
            cmd "/fill 594 119 -8 606 119 4 minecraft:grass_block"
            cmd "/fill 594 120 -8 606 124 4 minecraft:air"
            cmd "/setblock 600 120 -3 wildplus:illager_prison[facing=south]"
            cmd "/tp @s 600.5 120 0.5 180 0"
            cmd "/wildplus uitest prisonfill"; sleep 3
            cmd "/tp @s 600.5 121.2 1.8 180 12"; sleep 3
            xdotool key F1 || true; shot v39-prison-world; xdotool key F1 || true
            cmd "/tp @s 602.8 121.5 0.2 150 12"; sleep 3
            xdotool key F1 || true; shot v39-prison-world2; xdotool key F1 || true
            cmd "/tp @s 600.5 120 0.5 180 0"
            cmd "/wildplus uitest prison"; shot v39-prison
            xdotool mousemove 398 360; sleep 0.5; xdotool click 1; sleep 1.5; shot v39-prison-pick
            esc
            pkill -f java || true
          ' || true

      - name: Publish logs for debugging
        if: always()
        run: |
          mkdir -p /tmp/pub
          [ -f build.log ] && grep -E -B2 -A6 "error:|warning: \[|FAILURE|What went wrong|Exception|BUILD" build.log | head -c 200000 > /tmp/pub/build-errors.txt || true
          [ -f build.log ] && tail -c 60000 build.log > /tmp/pub/build-tail.txt || true
          [ -f server.log ] && grep -i -E "wildplus|error|exception|caused by|Done \(|failed|Dropped|Blood Moon|time to|block|Unknown|Incorrect|Could not" server.log | head -c 200000 > /tmp/pub/server-filtered.txt || true
          [ -f server.log ] && tail -c 80000 server.log > /tmp/pub/server-tail.txt || true
          [ -f client.log ] && grep -i -E "wildplus|missing|unable to|failed to load|exception|error|CHAT|System chat|HARVEST" client.log | grep -v -E "DEBUG|Masking|ALSA" | head -c 150000 > /tmp/pub/client-filtered.txt || true
          [ -f client.log ] && tail -c 60000 client.log > /tmp/pub/client-tail.txt || true
          cp shot-*.png /tmp/pub/ 2>/dev/null || true
          cp jstack-*.txt /tmp/pub/ 2>/dev/null || true
          echo "build=${{ steps.build.outcome }} smoke=${{ steps.smoke.outcome }} sha=${{ github.sha }}" > /tmp/pub/status.txt
          cd /tmp/pub
          git init -q -b ci-log
          git config user.name "ci"; git config user.email "ci@users.noreply.github.com"
          git add . && git commit -qm "logs ${{ github.sha }}"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" ci-log

      - name: Publish release jar
        if: steps.build.outcome == 'success' && steps.smoke.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          JAR=$(ls build/libs/*.jar | grep -v -E 'sources|javadoc' | head -1)
          gh release delete latest -y --cleanup-tag || true
          gh release create latest "$JAR" --title "Wild Plus (최신 빌드)" \
            --notes "Minecraft 26.3 · NeoForge 용. 이 jar 파일을 CurseForge 프로필의 mods 폴더에 넣으세요."

