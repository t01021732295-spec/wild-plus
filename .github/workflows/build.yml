name: Build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build with Gradle
        id: build
        run: |
          set -o pipefail
          ./gradlew build --no-daemon 2>&1 | tee build.log

      - name: Server smoke test
        id: smoke
        if: steps.build.outcome == 'success'
        timeout-minutes: 10
        run: |
          set -o pipefail
          mkdir -p run
          echo "eula=true" > run/eula.txt
          printf 'online-mode=false\npause-when-empty-seconds=0\n' > run/server.properties
          # 서버를 켜서 모드 로드 + 기능 동작을 명령어로 확인 후 종료
          (
            sleep 150
            run() { echo "$1"; sleep 2; }
            run "forceload add 0 0"
            run "setblock 0 120 0 minecraft:farmland"
            for age in 7 2; do
              run "kill @e[type=minecraft:item]"
              run "setblock 0 121 0 wildplus:chili_crop[age=$age]"
              run "loot spawn 0 125 0 mine 0 121 0 minecraft:stick"
              echo "say TEST crop age=$age"; sleep 1
              run "execute as @e[type=minecraft:item] run data get entity @s Item"
            done
            run "kill @e[type=minecraft:item]"
            run "loot spawn 0 125 0 loot wildplus:inject/treasure_rare"
            echo "say TEST treasure_rare"; sleep 1
            run "execute as @e[type=minecraft:item] run data get entity @s Item"
            run "kill @e[type=minecraft:item]"
            run "loot spawn 0 125 0 loot minecraft:chests/simple_dungeon"
            echo "say TEST dungeon"; sleep 1
            run "execute as @e[type=minecraft:item] run data get entity @s Item"
            run "kill @e[type=minecraft:item]"
            run "setblock 0 120 0 minecraft:grass_block"
            run "setblock 0 121 0 minecraft:short_grass"
            for k in $(seq 1 40); do echo "loot spawn 0 125 0 mine 0 121 0 minecraft:stick"; sleep 0.2; done
            echo "say TEST grass x40"; sleep 1
            run "execute as @e[type=minecraft:item] run data get entity @s Item"
            run "time set 14000"
            run "wildplus bloodmoon start"
            run "wildplus bloodmoon stop"
            run "time set 1000"
            # 클라이언트 화면 확인용 전시장
            run "gamerule advance_time false"
            run "gamerule doDaylightCycle false"
            run "weather clear"
            run "fill -8 119 -8 8 119 14 minecraft:grass_block"
            run "fill -8 120 -8 8 128 14 minecraft:air"
            run "setworldspawn 0 120 0 0 0"
            run "fill -4 119 3 -1 119 3 minecraft:farmland"
            run "setblock -4 120 3 wildplus:chili_crop[age=0]"
            run "setblock -3 120 3 wildplus:chili_crop[age=3]"
            run "setblock -2 120 3 wildplus:chili_crop[age=5]"
            run "setblock -1 120 3 wildplus:chili_crop[age=7]"
            run "summon minecraft:armor_stand 2 120 4 {Rotation:[180f,0f],ShowArms:1b,equipment:{head:{id:\"wildplus:bloodsteel_helmet\"},chest:{id:\"wildplus:bloodsteel_chestplate\"},legs:{id:\"wildplus:bloodsteel_leggings\"},feet:{id:\"wildplus:bloodsteel_boots\"},mainhand:{id:\"wildplus:bloodsteel_sword\"}}}"
            x=-4
            for it in blood_shard bloodsteel_ingot bloodsteel_sword bloodsteel_pickaxe bloodsteel_axe bloodsteel_shovel recall_scroll lucky_charm traveler_ration; do
              run "summon minecraft:item_display $x.5 123.2 6 {billboard:\"vertical\",transformation:{scale:[0.9f,0.9f,0.9f],translation:[0f,0f,0f],left_rotation:[0f,0f,0f,1f],right_rotation:[0f,0f,0f,1f]},item:{id:\"wildplus:$it\",count:1}}"
              x=$((x+1))
            done
            x=-4
            for it in chili_seeds chili spicy_stew honey_toast raw_skewer spicy_skewer bloodsteel_helmet bloodsteel_chestplate bloodsteel_boots; do
              run "summon minecraft:item_display $x.5 122.2 6 {billboard:\"vertical\",transformation:{scale:[0.9f,0.9f,0.9f],translation:[0f,0f,0f],left_rotation:[0f,0f,0f,1f],right_rotation:[0f,0f,0f,1f]},item:{id:\"wildplus:$it\",count:1}}"
              x=$((x+1))
            done
            sleep 10; echo "stop"
          ) | timeout 540 ./gradlew runServer --no-daemon 2>&1 | tee server.log || true
          grep -q 'Done (' server.log

      - name: Client visual test
        id: client
        if: steps.smoke.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 15
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          MC_QUICKPLAY: wildtest
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q xvfb libgl1-mesa-dri mesa-vulkan-drivers libvulkan1 imagemagick x11-utils xdotool
          mkdir -p run/saves && cp -r run/world run/saves/wildtest
          pip install -q nbtlib
          python3 - <<'PY'
          import nbtlib
          f = nbtlib.load('run/saves/wildtest/level.dat')
          d = f['Data'] if 'Data' in f else f
          print('level.dat keys:', sorted(d.keys()))
          d['allowCommands'] = nbtlib.Byte(1)
          f.save()
          PY
          printf 'onboardAccessibility:false\npauseOnLostFocus:false\nlang:ko_kr\n' > run/options.txt
          xvfb-run -a -s "-screen 0 1280x720x24+32 +extension GLX +render -noreset" bash -c '
            ./gradlew runClient --no-daemon > client.log 2>&1 &
            for i in $(seq 1 90); do sleep 5; grep -q -E "logged in with entity id|Loaded [0-9]+ advancements|joined the game" client.log && break; done
            sleep 40
            cmd() { xdotool key t; sleep 1; xdotool type --delay 40 "$1"; sleep 0.5; xdotool key Return; sleep 1.5; }
            cmd "/tp @s 0.5 120 0.5 0 12"
            for it in bloodsteel_sword bloodsteel_pickaxe bloodsteel_axe bloodsteel_shovel blood_shard bloodsteel_ingot recall_scroll lucky_charm traveler_ration chili_seeds chili spicy_stew honey_toast raw_skewer spicy_skewer bloodsteel_helmet bloodsteel_chestplate bloodsteel_leggings bloodsteel_boots; do
              cmd "/give @s wildplus:$it"
            done
            sleep 6
            xdotool key F1 || true
            sleep 2
            import -window root shot-world.png || true
            xdotool key F1 || true
            sleep 1
            xdotool key e || true
            sleep 3
            import -window root shot-inventory.png || true
            pkill -f java || true
          ' || true
          ls -la shot-world.png || true

      - name: Publish logs for debugging
        if: always()
        run: |
          mkdir -p /tmp/pub
          [ -f build.log ] && grep -E -B2 -A6 "error:|warning: \[|FAILURE|What went wrong|Exception|BUILD" build.log | head -c 200000 > /tmp/pub/build-errors.txt || true
          [ -f build.log ] && tail -c 60000 build.log > /tmp/pub/build-tail.txt || true
          [ -f server.log ] && grep -i -E "wildplus|error|exception|caused by|Done \(|failed|Dropped|Blood Moon|time to|block|Unknown|Incorrect|Could not" server.log | head -c 200000 > /tmp/pub/server-filtered.txt || true
          [ -f server.log ] && tail -c 80000 server.log > /tmp/pub/server-tail.txt || true
          [ -f client.log ] && grep -i -E "wildplus|missing|unable to|failed to load|exception|error" client.log | grep -v -E "DEBUG|Masking|ALSA" | head -c 150000 > /tmp/pub/client-filtered.txt || true
          [ -f client.log ] && tail -c 60000 client.log > /tmp/pub/client-tail.txt || true
          cp shot-*.png /tmp/pub/ 2>/dev/null || true
          echo "build=${{ steps.build.outcome }} smoke=${{ steps.smoke.outcome }} sha=${{ github.sha }}" > /tmp/pub/status.txt
          cd /tmp/pub
          git init -q -b ci-log
          git config user.name "ci"; git config user.email "ci@users.noreply.github.com"
          git add . && git commit -qm "logs ${{ github.sha }}"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" ci-log

      - name: Publish release jar
        if: steps.build.outcome == 'success' && steps.smoke.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          JAR=$(ls build/libs/*.jar | grep -v -E 'sources|javadoc' | head -1)
          gh release delete latest -y --cleanup-tag || true
          gh release create latest "$JAR" --title "Wild Plus (최신 빌드)" \
            --notes "Minecraft 26.3 · NeoForge 용. 이 jar 파일을 CurseForge 프로필의 mods 폴더에 넣으세요."

