name: Build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

# 새 커밋이 올라오면 이전 빌드는 취소 (로그·릴리스가 섞이지 않도록)
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build with Gradle
        id: build
        run: |
          set -o pipefail
          ./gradlew build --no-daemon 2>&1 | tee build.log

      - name: Server smoke test
        id: smoke
        if: steps.build.outcome == 'success'
        timeout-minutes: 22
        run: |
          set -o pipefail
          mkdir -p run
          echo "eula=true" > run/eula.txt
          printf 'online-mode=false\npause-when-empty-seconds=0\n' > run/server.properties
          # 서버를 켜서 모드 로드 + 기능 동작을 명령어로 확인 후 종료
          (
            until grep -q 'Done (' server.log 2>/dev/null; do sleep 2; done
            sleep 8
            run() { echo "$1"; sleep 0.7; }
            run "forceload add 0 0"
            run "setblock 0 120 0 minecraft:farmland"
            for age in 7 2; do
              run "kill @e[type=minecraft:item]"
              run "setblock 0 121 0 wildplus:chili_crop[age=$age]"
              run "loot spawn 0 125 0 mine 0 121 0 minecraft:stick"
              echo "say TEST crop age=$age"; sleep 1
              run "execute as @e[type=minecraft:item] run data get entity @s Item"
            done
            run "kill @e[type=minecraft:item]"
            run "loot spawn 0 125 0 loot wildplus:inject/treasure_rare"
            echo "say TEST treasure_rare"; sleep 1
            run "execute as @e[type=minecraft:item] run data get entity @s Item"
            run "kill @e[type=minecraft:item]"
            run "loot spawn 0 125 0 loot minecraft:chests/simple_dungeon"
            echo "say TEST dungeon"; sleep 1
            run "execute as @e[type=minecraft:item] run data get entity @s Item"
            run "kill @e[type=minecraft:item]"
            run "setblock 0 120 0 minecraft:grass_block"
            run "setblock 0 121 0 minecraft:short_grass"
            for k in $(seq 1 40); do echo "loot spawn 0 125 0 mine 0 121 0 minecraft:stick"; sleep 0.2; done
            echo "say TEST grass x40"; sleep 1
            run "execute as @e[type=minecraft:item] run data get entity @s Item"
            # ── 2차: 스프링클러 성장 비교 (스프링클러 있는 밭 vs 없는 밭) ──
            run "forceload add 16 16 60 40"
            run "fill 20 119 20 28 119 28 minecraft:farmland[moisture=7]"
            run "fill 20 120 20 28 120 28 wildplus:tomato_crop[age=0]"
            run "setblock 24 120 24 wildplus:sprinkler"
            run "fill 40 119 20 48 119 28 minecraft:farmland[moisture=7]"
            run "fill 40 120 20 48 120 28 wildplus:tomato_crop[age=0]"
            # ── 2차: 광석 생성 ──
            for y in -40 -20 -8 10 20; do run "place feature wildplus:ore_mythril 0 $y 0"; done
            for y in -10 30 60; do run "place feature wildplus:ore_jade 8 $y 8"; done
            # ── 2차: 작물 수확 ──
            run "kill @e[type=minecraft:item]"
            run "setblock 0 120 0 minecraft:farmland"
            for c in "tomato_crop[age=7]" "tomato_crop[age=3]" "strawberry_crop[age=7]" "strawberry_crop[age=1]"; do
              run "setblock 0 121 0 wildplus:$c"
              run "loot spawn 0 125 0 mine 0 121 0 minecraft:stick"
            done
            echo "say TEST crops2"; sleep 1
            run "execute as @e[type=minecraft:item] run data get entity @s Item"
            run "kill @e[type=minecraft:item]"
            run "loot spawn 0 125 0 loot wildplus:gameplay/sunken_chest"
            echo "say TEST sunken_chest"; sleep 1
            run "execute as @e[type=minecraft:item] run data get entity @s Item"
            run "kill @e[type=minecraft:item]"
            # ── 2차: 낚시 (일반 낚싯대 / 비취 낚싯대 / 비 오는 날) ──
            for rod in minecraft:fishing_rod wildplus:jade_fishing_rod; do
              for k in $(seq 1 80); do echo "loot spawn 0 125 0 fish minecraft:gameplay/fishing 0 121 0 $rod"; sleep 0.15; done
              echo "say TEST fishing $rod"; sleep 1
              run "execute as @e[type=minecraft:item] run data get entity @s Item"
              run "kill @e[type=minecraft:item]"
            done
            run "weather thunder"
            for k in $(seq 1 60); do echo "loot spawn 0 125 0 fish minecraft:gameplay/fishing 0 121 0 wildplus:jade_fishing_rod"; sleep 0.15; done
            echo "say TEST fishing thunder"; sleep 1
            run "execute as @e[type=minecraft:item] run data get entity @s Item"
            run "kill @e[type=minecraft:item]"
            run "weather clear"
            # 스프링클러 결과: 아직 age=0 인 작물 수 (적을수록 많이 자람)
            echo "say TEST sprinkler_plot"; sleep 1
            run "fill 20 120 20 28 120 28 minecraft:air replace wildplus:tomato_crop[age=0]"
            echo "say TEST control_plot"; sleep 1
            run "fill 40 120 20 48 120 28 minecraft:air replace wildplus:tomato_crop[age=0]"
            run "time set 14000"
            run "wildplus bloodmoon start"
            run "wildplus bloodmoon stop"
            for k in $(seq 1 60); do echo "loot spawn 0 125 0 fish minecraft:gameplay/fishing 0 121 0 wildplus:jade_fishing_rod"; sleep 0.15; done
            echo "say TEST fishing night"; sleep 1
            run "execute as @e[type=minecraft:item] run data get entity @s Item"
            run "kill @e[type=minecraft:item]"
            run "time set 1000"
            # 클라이언트 화면 확인용 전시장
            run "gamerule advance_time false"
            run "gamerule doDaylightCycle false"
            run "weather clear"
            run "fill -8 119 -8 8 119 14 minecraft:grass_block"
            run "fill -8 120 -8 8 128 14 minecraft:air"
            run "setworldspawn 0 120 0 0 0"
            run "fill -4 119 3 -1 119 3 minecraft:farmland"
            run "setblock -4 120 3 wildplus:chili_crop[age=0]"
            run "setblock -3 120 3 wildplus:chili_crop[age=3]"
            run "setblock -2 120 3 wildplus:chili_crop[age=5]"
            run "setblock -1 120 3 wildplus:chili_crop[age=7]"
            run "summon minecraft:armor_stand 2 120 4 {Rotation:[180f,0f],ShowArms:1b,equipment:{head:{id:\"wildplus:bloodsteel_helmet\"},chest:{id:\"wildplus:bloodsteel_chestplate\"},legs:{id:\"wildplus:bloodsteel_leggings\"},feet:{id:\"wildplus:bloodsteel_boots\"},mainhand:{id:\"wildplus:bloodsteel_sword\"}}}"
            x=-4
            for it in blood_shard bloodsteel_ingot bloodsteel_sword bloodsteel_pickaxe bloodsteel_axe bloodsteel_shovel recall_scroll lucky_charm traveler_ration; do
              run "summon minecraft:item_display $x.5 123.2 6 {billboard:\"vertical\",transformation:{scale:[0.9f,0.9f,0.9f],translation:[0f,0f,0f],left_rotation:[0f,0f,0f,1f],right_rotation:[0f,0f,0f,1f]},item:{id:\"wildplus:$it\",count:1}}"
              x=$((x+1))
            done
            x=-4
            for it in chili_seeds chili spicy_stew honey_toast raw_skewer spicy_skewer bloodsteel_helmet bloodsteel_chestplate bloodsteel_boots; do
              run "summon minecraft:item_display $x.5 122.2 6 {billboard:\"vertical\",transformation:{scale:[0.9f,0.9f,0.9f],translation:[0f,0f,0f],left_rotation:[0f,0f,0f,1f],right_rotation:[0f,0f,0f,1f]},item:{id:\"wildplus:$it\",count:1}}"
              x=$((x+1))
            done
            # 2차 전시장 (x=100)
            run "forceload add 88 -12 116 20"
            run "fill 92 119 -8 108 119 14 minecraft:grass_block"
            run "fill 92 120 -8 108 128 14 minecraft:air"
            bx=95
            for b in mythril_ore deepslate_mythril_ore mythril_block jade_ore deepslate_jade_ore jade_block; do
              run "setblock $bx 120 7 wildplus:$b"; bx=$((bx+2))
            done
            run "fill 95 119 3 100 119 4 minecraft:farmland[moisture=7]"
            ax=95
            for a in 0 3 5 7 7 7; do
              run "setblock $ax 120 3 wildplus:tomato_crop[age=$a]"
              run "setblock $ax 120 4 wildplus:strawberry_crop[age=$a]"
              ax=$((ax+1))
            done
            run "setblock 102 120 4 wildplus:sprinkler"
            x=96
            for it in raw_mythril mythril_ingot jade mythril_sword mythril_pickaxe mythril_axe mythril_shovel mythril_hoe jade_fishing_rod; do
              run "summon minecraft:item_display $x.5 125.2 8 {billboard:\"vertical\",item:{id:\"wildplus:$it\",count:1}}"; x=$((x+1))
            done
            x=96
            for it in rainbow_trout cooked_rainbow_trout golden_carp moonlight_fish storm_eel grilled_eel anglerfish ice_smelt sunken_chest; do
              run "summon minecraft:item_display $x.5 124.2 8 {billboard:\"vertical\",item:{id:\"wildplus:$it\",count:1}}"; x=$((x+1))
            done
            x=96
            for it in tomato_seeds tomato strawberry fertilizer tomato_soup pizza strawberry_tart sashimi_platter fish_stew; do
              run "summon minecraft:item_display $x.5 123.2 8 {billboard:\"vertical\",item:{id:\"wildplus:$it\",count:1}}"; x=$((x+1))
            done
            # ── 3차: 몹·구조물·자판기 시험 ──
            run "forceload add 360 -16 440 32"
            for mob in merchant blacksmith_merchant bandit golden_slime; do run "summon wildplus:$mob 0 121 6"; done
            echo "say TEST mobs"; sleep 1
            run "execute as @e[type=wildplus:merchant] run data get entity @s id"
            run "execute as @e[type=wildplus:bandit] run data get entity @s HandItems"
            run "execute as @e[type=wildplus:golden_slime] run data get entity @s Size"
            run "kill @e[type=wildplus:bandit]"
            run "kill @e[type=wildplus:golden_slime]"
            run "kill @e[type=minecraft:item]"
            run "loot spawn 0 125 0 loot wildplus:entities/bandit"
            run "loot spawn 0 125 0 loot wildplus:chests/bandit_camp"
            run "loot spawn 0 125 0 loot wildplus:chests/trading_post"
            echo "say TEST loot3"; sleep 1
            run "execute as @e[type=minecraft:item] run data get entity @s Item"
            run "kill @e[type=minecraft:item]"
            run "setblock 0 121 3 wildplus:vending_machine[facing=north]{item0:{id:\"minecraft:bread\",count:8},item1:{id:\"wildplus:pizza\",count:4},item2:{id:\"minecraft:cake\",count:1},item3:{id:\"minecraft:apple\",count:8},item4:{id:\"wildplus:tomato\",count:8},item5:{id:\"minecraft:cookie\",count:16},item6:{id:\"wildplus:strawberry\",count:8},item7:{id:\"minecraft:golden_carrot\",count:8},item8:{id:\"wildplus:honey_toast\",count:4},prices:[I;2,4,15,1,2,1,2,6,5],infinite:1b}"
            sleep 2
            echo "say TEST vending"; sleep 1
            run "data get block 0 121 3"
            # 2칸 자판기: 위 칸 자동 생성 / 위 칸만 없어지면 다시 채움 / 아래 칸을 부수면 위 칸도 사라지고 자판기 1개만 떨어짐
            run "execute if block 0 122 3 wildplus:vending_machine[half=upper] run say TALL_OK"
            run "setblock 0 122 3 minecraft:air"
            sleep 2
            run "execute if block 0 122 3 wildplus:vending_machine[half=upper] if block 0 121 3 wildplus:vending_machine run say TALL_HEAL_OK"
            run "setblock 0 121 3 minecraft:air destroy"
            sleep 1
            run "execute if block 0 122 3 minecraft:air run say PAIR_BREAK_OK"
            run "execute as @e[type=minecraft:item,x=0,y=121,z=3,distance=..4] run data get entity @s Item"
            run "kill @e[type=minecraft:item]"
            for k in $(seq 1 30); do echo "loot spawn 0 125 0 loot wildplus:gameplay/gacha"; sleep 0.15; done
            echo "say TEST gacha x30"; sleep 1
            run "execute as @e[type=minecraft:item] run data get entity @s Item"
            run "kill @e[type=minecraft:item]"
            run "setblock 1 121 3 wildplus:grave{items:[{id:\"minecraft:diamond\",count:3}],owner_name:\"Tester\"}"
            echo "say TEST grave"; sleep 1
            run "data get block 1 121 3"
            run "place structure wildplus:trading_post 600 70 600"
            run "place structure wildplus:bandit_camp 700 70 600"
            echo "say TEST structures"; sleep 1
            run "locate structure wildplus:trading_post"
            sleep 4
            run "locate structure wildplus:bandit_camp"
            sleep 4
            # 3차 전시장 (x=372~432): 바닥 + 구조물 템플릿 + 상인·자판기
            for x0 in 372 404; do
              run "fill $x0 119 -12 $((x0+31)) 119 25 minecraft:grass_block"
              run "fill $x0 120 -12 $((x0+31)) 127 25 minecraft:air"
              run "fill $x0 128 -12 $((x0+31)) 135 25 minecraft:air"
            done
            run "place template wildplus:trading_post 400 120 0"
            run "place template wildplus:bandit_camp 416 120 0"
            # 상점 마을 (x 436~487)
            run "forceload add 436 -12 519 71"
            for z0 in -12 8 28 48 68; do
              z1=$((z0+19)); [ $z1 -gt 71 ] && z1=71
              run "fill 436 119 $z0 519 119 $z1 minecraft:grass_block"
              run "fill 436 120 $z0 519 127 $z1 minecraft:air"
              run "fill 436 128 $z0 519 135 $z1 minecraft:air"
            done
            run "place template wildplus:town 438 120 -10"
            # 도적 아지트 (x 530~585)
            run "forceload add 528 -12 589 49"
            for z0 in -12 8 28 48; do
              z1=$((z0+19)); [ $z1 -gt 49 ] && z1=49
              run "fill 528 119 $z0 589 119 $z1 minecraft:grass_block"
              run "fill 528 120 $z0 589 127 $z1 minecraft:air"
              run "fill 528 128 $z0 589 135 $z1 minecraft:air"
            done
            run "place template wildplus:bandit_hideout 530 120 -10"
            run "place structure wildplus:bandit_hideout 1100 70 600"
            # 대형 던전 (x 600~663, 땅 y 120)
            run "forceload add 598 -12 665 55"
            run "place template wildplus:dungeon 600 98 -10"
            run "place structure wildplus:dungeon 1300 70 600"
            sleep 2
            run "execute if block 619 109 9 minecraft:spawner if block 632 99 52 minecraft:air run say DUNGEON_OK"
            run "place structure wildplus:town 900 70 600"
            echo "say TEST town"; sleep 1
            run "summon wildplus:merchant 380.5 120 5.5 {NoAI:1b,Rotation:[180f,0f]}"
            run "summon wildplus:blacksmith_merchant 378.5 120 6.5 {NoAI:1b,Rotation:[160f,0f]}"
            run "summon wildplus:bandit 386.5 120 7.5 {NoAI:1b,PersistenceRequired:1b,Rotation:[200f,0f]}"
            run "summon wildplus:golden_slime 388.5 120 6.5 {NoAI:1b,PersistenceRequired:1b,Size:2}"
            run "summon wildplus:farmer_merchant 382.5 120 7.5 {NoAI:1b,Rotation:[180f,0f]}"
            run "summon wildplus:fisher_merchant 384.5 120 7.5 {NoAI:1b,Rotation:[180f,0f]}"
            run "summon wildplus:banker_merchant 376.5 120 6.5 {NoAI:1b,Rotation:[200f,0f]}"
            run "setblock 383 120 4 wildplus:vending_machine[facing=north]{item0:{id:\"minecraft:bread\",count:8},item1:{id:\"wildplus:pizza\",count:4},item2:{id:\"minecraft:cake\",count:1},item3:{id:\"minecraft:apple\",count:8},item4:{id:\"wildplus:tomato\",count:8},item5:{id:\"minecraft:cookie\",count:16},item6:{id:\"wildplus:strawberry\",count:8},item7:{id:\"minecraft:golden_carrot\",count:8},item8:{id:\"wildplus:honey_toast\",count:4},prices:[I;2,4,15,1,2,1,2,6,5],infinite:1b}"
            run "setblock 384 120 4 wildplus:vending_machine[facing=north]{item0:{id:\"minecraft:torch\",count:32},item1:{id:\"wildplus:recall_scroll\",count:2},item2:{id:\"wildplus:event_bottle\",count:1,components:{\"minecraft:custom_data\":{wildplus_event:\"GOLD_RUSH\"}}},item3:{id:\"minecraft:arrow\",count:16},item4:{id:\"wildplus:fertilizer\",count:8},item8:{id:\"minecraft:diamond\",count:1},prices:[I;1,40,10,2,3,10,10,10,99],infinite:1b}"
            run "setblock 385 120 4 wildplus:gacha_machine[facing=north]"
            run "setblock 381 120 4 wildplus:grave[facing=north]{items:[{id:\"minecraft:diamond\",count:3}],owner_name:\"Tester\"}"
            # 5차 전시장 (z=-6 줄, 앞면이 북쪽)
            run "setblock 380 120 -6 wildplus:warp_point"
            run "setblock 382 120 -6 wildplus:warp_point"
            run "setblock 384 120 -6 wildplus:stock_terminal[facing=north]"
            run "setblock 386 120 -6 wildplus:atm[facing=north]"
            run "setblock 388 120 -6 wildplus:bounty_board[facing=north]"
            run "setblock 390 120 -6 wildplus:exchange[facing=north]"
            run "setblock 392 120 -6 wildplus:shipping_bin"
            run "setblock 394 120 -6 wildplus:enhance_table[facing=north]"
            run "setblock 396 120 -6 wildplus:pharmacy[facing=north]"
            run "setblock 398 120 -6 wildplus:weather_station[facing=north]"
            run "setblock 400 120 -6 wildplus:chunk_loader"
            # 13차 전시: 루비 광석·블록, 루비 갑옷 거치대
            run "setblock 402 120 -6 wildplus:ruby_ore"
            run "setblock 403 120 -6 wildplus:deepslate_ruby_ore"
            run "setblock 404 120 -6 wildplus:ruby_block"
            run "summon minecraft:armor_stand 406.5 120 -5.5 {Rotation:[180f,0f],ShowArms:1b,equipment:{head:{id:\"wildplus:ruby_helmet\",count:1},chest:{id:\"wildplus:ruby_chestplate\",count:1},legs:{id:\"wildplus:ruby_leggings\",count:1},feet:{id:\"wildplus:ruby_boots\",count:1},mainhand:{id:\"wildplus:ruby_sword\",count:1}}}"
            # 5차 서버 시험: 주식 시세, 출하 상자 아침 판매
            run "wildplus stocks refresh"
            sleep 15
            run "setblock 2 121 3 wildplus:shipping_bin{items:[{id:\"minecraft:diamond\",count:2},{id:\"minecraft:dirt\",count:5}],owner:[I;1,2,3,4]}"
            sleep 3
            run "time add 24000"
            sleep 4
            echo "say TEST shipping"; sleep 1
            run "data get block 2 121 3 items"
            run "wildplus interest"
            run "wildplus treasury"
            # 호퍼 자동 보충: 빵 5개 든 자판기 옆 호퍼(빵 10, 사과 3) → 빵 15 + 사과 3
            run "setblock 4 121 6 wildplus:vending_machine[facing=north]{item0:{id:\"minecraft:bread\",count:5}}"
            run "setblock 5 121 6 minecraft:hopper[facing=west]{Items:[{Slot:0b,id:\"minecraft:bread\",count:10},{Slot:1b,id:\"minecraft:apple\",count:3}]}"
            sleep 8
            echo "say TEST hopper"; sleep 1
            run "data get block 4 121 6"
            # 출하 상자 호퍼 연동: 위 호퍼(밀 5) → 상자
            run "setblock 8 121 6 wildplus:shipping_bin"
            run "setblock 8 122 6 minecraft:hopper[facing=down]{Items:[{Slot:0b,id:\"minecraft:wheat\",count:5}]}"
            sleep 6
            echo "say TEST bin hopper"; sleep 1
            run "data get block 8 121 6 items"
            # 8차: 자동 수확기(스프링클러 밑) · 광석 채굴기(2분 전부터 다이아) · 자동 낚시 장치(물 위 + 낚싯대)
            run "fill 50 119 30 58 119 38 minecraft:grass_block"
            run "fill 50 120 30 58 125 38 minecraft:air"
            run "fill 52 119 32 56 119 36 minecraft:farmland[moisture=7]"
            run "fill 52 120 32 56 120 36 minecraft:wheat[age=7]"
            run "setblock 54 120 34 wildplus:auto_harvester"
            run "setblock 54 121 34 wildplus:sprinkler"
            T=$(( $(date +%s%3N) - 120000 ))
            run "setblock 50 120 30 wildplus:ore_miner{selected:9,last:${T}L,progress:0L,next:45000L}"
            run "setblock 58 119 38 minecraft:water"
            run "setblock 58 120 38 wildplus:auto_fisher{timer:30,items:[{id:\"minecraft:fishing_rod\",count:1}]}"
            sleep 8
            echo "say TEST machines"; sleep 1
            run "execute unless block 52 120 32 minecraft:wheat[age=7] if block 52 120 32 minecraft:wheat unless block 56 120 36 minecraft:wheat[age=7] run say AUTOHARVEST_OK"
            run "data get block 54 120 34 items"
            run "data get block 50 120 30 items"
            run "data get block 58 120 38 items"
            # 편의 기능 시험장: 나무 기둥(x=395), 다 자란 밀(x=398)
            run "fill 395 120 3 395 125 3 minecraft:oak_log"
            run "fill 394 126 2 396 127 4 minecraft:oak_leaves[persistent=true]"
            run "setblock 398 119 3 minecraft:farmland[moisture=7]"
            run "setblock 398 120 3 minecraft:wheat[age=7]"
            # 13차: 이벤트 투척병(영웅의 시간)이 땅에 깨지면 이벤트 시작 · 루비 광맥 생성
            run "fill 60 119 60 62 119 62 minecraft:stone"
            run "summon minecraft:snowball 61.5 124 61.5 {Item:{id:\"wildplus:event_bottle\",count:1,components:{\"minecraft:custom_data\":{wildplus_event:\"HERO_TIME\"}}},Motion:[0.0,-1.0,0.0]}"
            sleep 4
            run "place feature wildplus:ore_ruby 0 -40 0"
            run "wildplus event stop"
            run "gamerule immediate_respawn true"
            run "gamerule doImmediateRespawn true"
            sleep 10; echo "stop"
          ) | timeout 1200 ./gradlew runServer --no-daemon 2>&1 | tee server.log || true
          grep -q 'Done (' server.log

      - name: Client visual test
        id: client
        if: steps.smoke.outcome == 'success' && !contains(github.event.head_commit.message, '[quick]')
        continue-on-error: true
        timeout-minutes: 40
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          MC_QUICKPLAY: wildtest
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q xvfb libgl1-mesa-dri mesa-vulkan-drivers libvulkan1 imagemagick x11-utils xdotool
          mkdir -p run/saves && cp -r run/world run/saves/wildtest
          pip install -q nbtlib
          python3 - <<'PY'
          import nbtlib
          f = nbtlib.load('run/saves/wildtest/level.dat')
          d = f['Data'] if 'Data' in f else f
          print('level.dat keys:', sorted(d.keys()))
          d['allowCommands'] = nbtlib.Byte(1)
          f.save()
          PY
          printf 'onboardAccessibility:false\npauseOnLostFocus:false\nlang:ko_kr\n' > run/options.txt
