name: API Probe

# 개발용: 마인크래프트 클래스의 메서드 시그니처를 확인하는 워크플로입니다.
on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@v4

      - name: Prepare Minecraft artifacts
        run: ./gradlew createMinecraftArtifacts --no-configuration-cache

      - name: Dump signatures
        run: |
          JAR=""
          for j in $(find build ~/.gradle -name '*.jar' 2>/dev/null | grep -i -E 'moddev|neoforge|minecraft' | grep -v sources); do
            if unzip -l "$j" 2>/dev/null | grep -q 'net/minecraft/world/item/Item.class'; then JAR="$j"; break; fi
          done
          SRC=""
          for j in $(find build ~/.gradle -name '*sources*.jar' 2>/dev/null); do
            if unzip -l "$j" 2>/dev/null | grep -q 'net/minecraft/world/item/Item.java'; then SRC="$j"; break; fi
          done
          echo "JAR=$JAR"; echo "SRC=$SRC"
          mkdir -p out src
          [ -n "$SRC" ] && (cd src && unzip -q -o "$SRC")
          while read -r c; do
            [ -z "$c" ] && continue
            echo "######## $c"
            javap -cp "$JAR" -p "$c" 2>&1 | grep -v -E '^\s*(private static final long|private static final int [A-Z_]+;$)' || true
          done < .github/probe-classes.txt > out/probe.txt
          if [ -f .github/probe-grep.txt ]; then
            while IFS='|' read -r file pattern ctx; do
              [ -z "$file" ] && continue
              echo "######## grep $file :: $pattern"
              grep -n -E -A "${ctx:-3}" "$pattern" "src/$file" 2>&1 | head -200 || true
            done < .github/probe-grep.txt >> out/probe.txt
          fi
          wc -c out/probe.txt
          echo "===BEGIN PROBE==="
          cat out/probe.txt
          echo "===END PROBE==="
